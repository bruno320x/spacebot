name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-Dwarnings"

jobs:
  rust-diagnostics:
    name: Rust baseline diagnostics
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler pkg-config libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: clippy,rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: /tmp/spacebot-test-embedding-cache
          key: fastembed-onnx-v1

      - name: Preflight
        id: preflight
        continue-on-error: true
        run: ./scripts/preflight.sh --ci

      - name: Formatting
        id: fmt
        continue-on-error: true
        run: cargo fmt --all -- --check

      - name: Cargo check
        id: check
        continue-on-error: true
        run: cargo check --all-targets

      - name: Clippy
        id: clippy
        continue-on-error: true
        run: cargo clippy --all-targets

      - name: Library tests
        id: lib_tests
        continue-on-error: true
        run: cargo test --lib

      - name: Integration tests compile
        id: integration_compile
        continue-on-error: true
        run: cargo test --tests --no-run

      - name: Original full gate
        id: original_gate
        continue-on-error: true
        run: ./scripts/gate-pr.sh --ci

      - name: Check optional metrics feature
        id: metrics
        continue-on-error: true
        run: cargo check --all-targets --features metrics

      - name: Require all baseline gates
        if: always()
        run: |
          echo "preflight=${{ steps.preflight.outcome }}"
          echo "fmt=${{ steps.fmt.outcome }}"
          echo "check=${{ steps.check.outcome }}"
          echo "clippy=${{ steps.clippy.outcome }}"
          echo "lib_tests=${{ steps.lib_tests.outcome }}"
          echo "integration_compile=${{ steps.integration_compile.outcome }}"
          echo "original_gate=${{ steps.original_gate.outcome }}"
          echo "metrics=${{ steps.metrics.outcome }}"
          test '${{ steps.preflight.outcome }}' = success
          test '${{ steps.fmt.outcome }}' = success
          test '${{ steps.check.outcome }}' = success
          test '${{ steps.clippy.outcome }}' = success
          test '${{ steps.lib_tests.outcome }}' = success
          test '${{ steps.integration_compile.outcome }}' = success
          test '${{ steps.original_gate.outcome }}' = success
          test '${{ steps.metrics.outcome }}' = success
