name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (for example v0.5.0). Defaults to the git ref."
        required: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/spacebot

jobs:
  quality-gate:
    name: Release quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler pkg-config libssl-dev lld

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: clippy,rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: /tmp/spacebot-test-embedding-cache
          key: fastembed-onnx-v1

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      - name: Install interface dependencies
        working-directory: interface
        run: bun ci

      - name: Full Rust gate
        run: ./scripts/gate-pr.sh --ci

      - name: Check metrics feature
        run: cargo check --all-targets --features metrics

      - name: Verify OpenAPI/typegen
        run: |
          cargo run --bin openapi-spec > /tmp/spacebot-openapi.json
          cd interface
          bunx openapi-typescript /tmp/spacebot-openapi.json -o /tmp/spacebot-schema-check.d.ts
          diff -u src/api/schema.d.ts /tmp/spacebot-schema-check.d.ts

      - name: Typecheck interface
        working-directory: interface
        run: bunx tsc --noEmit

      - name: Build interface
        working-directory: interface
        run: bun run build

  verify-version:
    name: Verify release version
    needs: quality-gate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Verify Cargo.toml version matches tag
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          CARGO_VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          echo "Git tag version:    $TAG"
          echo "Cargo.toml version: $CARGO_VERSION"
          if [ "$TAG" != "$CARGO_VERSION" ]; then
            echo "::error::Version mismatch: tag v${TAG}, Cargo.toml ${CARGO_VERSION}"
            exit 1
          fi

  build-binaries:
    name: Build ${{ matrix.target }}
    needs:
      - quality-gate
      - verify-version
    if: always() && needs.quality-gate.result == 'success' && (needs.verify-version.result == 'success' || needs.verify-version.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            os: linux
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            os: linux
          - target: aarch64-apple-darwin
            runner: macos-15
            os: macos
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            os: macos
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}

      - name: Install protoc
        uses: arduino/setup-protoc@v3

      - name: Install lld
        # .cargo/config.toml enables -fuse-ld=lld for x86_64-unknown-linux-gnu,
        # so the Linux release build needs the linker installed.
        if: matrix.os == 'linux'
        run: sudo apt-get update && sudo apt-get install -y lld

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      - name: Build frontend
        shell: bash
        env:
          SPACEBOT_SKIP_FRONTEND_BUILD: "1"
        run: |
          cd interface
          bun ci
          cd ..
          ./scripts/build-opencode-embed.sh
          cd interface
          bun run build

      - name: Determine version tag
        id: version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            VERSION="${{ github.event.inputs.tag }}"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="dev-$(echo "$GITHUB_SHA" | head -c 7)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package binary
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DIR="spacebot-${VERSION}-${{ matrix.target }}"
          mkdir -p "$DIR"
          cp "target/${{ matrix.target }}/release/spacebot" "$DIR/spacebot"
          tar -czf "spacebot-${VERSION}-${{ matrix.target }}.tar.gz" "$DIR"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: spacebot-${{ matrix.target }}
          path: spacebot-${{ steps.version.outputs.version }}-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  build-docker:
    name: Build Docker ${{ matrix.platform }}
    needs:
      - quality-gate
      - verify-version
    if: always() && needs.quality-gate.result == 'success' && (needs.verify-version.result == 'success' || needs.verify-version.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine version tag
        id: version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            VERSION="${{ github.event.inputs.tag }}"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="dev-$(echo "$GITHUB_SHA" | head -c 7)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Platform pair
        id: platform
        run: echo "pair=$(echo '${{ matrix.platform }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - name: Build and push platform image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.IMAGE }}:build-${{ steps.platform.outputs.pair }}-${{ github.sha }}
          cache-from: type=gha,scope=release-${{ steps.platform.outputs.pair }}
          cache-to: type=gha,mode=max,scope=release-${{ steps.platform.outputs.pair }}

  merge-docker:
    name: Publish multi-arch image
    needs: build-docker
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        run: |
          docker buildx imagetools create \
            --tag ${{ env.IMAGE }}:${{ needs.build-docker.outputs.version }} \
            --tag ${{ env.IMAGE }}:latest \
            ${{ env.IMAGE }}:build-linux-amd64-${{ github.sha }} \
            ${{ env.IMAGE }}:build-linux-arm64-${{ github.sha }}

      - name: Inspect published manifest
        run: docker buildx imagetools inspect ${{ env.IMAGE }}:${{ needs.build-docker.outputs.version }}

  create-release:
    name: Create GitHub Release
    needs:
      - quality-gate
      - build-binaries
      - merge-docker
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: binaries
          pattern: spacebot-*
          merge-multiple: false

      - name: Prepare release assets and checksums
        run: |
          mkdir -p release-assets
          find binaries -type f -name "*.tar.gz" -exec cp {} release-assets/ \;
          cd release-assets
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-binaries.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/*.tar.gz
            release-assets/SHA256SUMS

  update-homebrew:
    name: Update upstream Homebrew tap
    needs:
      - build-binaries
      - create-release
    if: startsWith(github.ref, 'refs/tags/v') && github.repository_owner == 'spacedriveapp'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: binaries
          pattern: spacebot-*
          merge-multiple: false

      - name: Compute SHA256 checksums
        id: sha
        run: |
          for arch in aarch64-apple-darwin x86_64-apple-darwin aarch64-unknown-linux-gnu x86_64-unknown-linux-gnu; do
            FILE=$(find binaries -name "*${arch}*.tar.gz" | head -1)
            KEY=$(echo "$arch" | tr '-' '_')
            echo "${KEY}=$(shasum -a 256 "$FILE" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          done

      - name: Update formula in tap repo
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VERSION="${{ needs.build-binaries.outputs.version }}"
          VERSION_NUM="${VERSION#v}"
          REPO="${{ github.repository }}"
          BASE="https://github.com/${REPO}/releases/download/${VERSION}"

          git clone "https://x-access-token:${GH_TOKEN}@github.com/spacedriveapp/homebrew-tap.git" tap
          mkdir -p tap/Formula

          SHA_ARM_MAC="${{ steps.sha.outputs.aarch64_apple_darwin }}"
          SHA_X86_MAC="${{ steps.sha.outputs.x86_64_apple_darwin }}"
          SHA_ARM_LINUX="${{ steps.sha.outputs.aarch64_unknown_linux_gnu }}"
          SHA_X86_LINUX="${{ steps.sha.outputs.x86_64_unknown_linux_gnu }}"

          cat > tap/Formula/spacebot.rb <<RUBY
          class Spacebot < Formula
            desc "Agentic LLM system with specialized processes"
            homepage "https://github.com/${REPO}"
            version "${VERSION_NUM}"
            license "FSL-1.1-ALv2"

            on_macos do
              if Hardware::CPU.arm?
                url "${BASE}/spacebot-${VERSION}-aarch64-apple-darwin.tar.gz"
                sha256 "${SHA_ARM_MAC}"
              else
                url "${BASE}/spacebot-${VERSION}-x86_64-apple-darwin.tar.gz"
                sha256 "${SHA_X86_MAC}"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "${BASE}/spacebot-${VERSION}-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "${SHA_ARM_LINUX}"
              else
                url "${BASE}/spacebot-${VERSION}-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "${SHA_X86_LINUX}"
              end
            end

            def install
              bin.install "spacebot"
            end

            test do
              assert_match "spacebot", shell_output("#{bin}/spacebot --version")
            end
          end
          RUBY

          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/spacebot.rb
          git commit -m "spacebot ${VERSION}" || echo "No changes to commit"
          git push
