name: Upstream PR Compatibility Matrix

on:
  push:
    branches:
      - automation/upstream-audit
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    name: Audit upstream #${{ matrix.pr }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        pr: [15,16,17,121,152,177,200,208,254,269,287,294,324,326,367,375,382,401,410,414,419,430,474,475,476,490,511,512,519,534,544,542,543,545,547,550,551,552,554,556,558,561,563,571,572,575,576,577,578,579,582,595,598,600,602,604,607,608,637,639,641,649,650,651,652,653]
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact upstream PR delta
        id: audit
        shell: bash
        run: |
          set -euo pipefail
          PR="${{ matrix.pr }}"
          TARGET="integration/upstream-prs"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add canonical https://github.com/spacedriveapp/spacebot.git || true
          git fetch origin "$TARGET"

          PR_JSON=$(gh api "repos/spacedriveapp/spacebot/pulls/${PR}")
          BASE_SHA=$(jq -r '.base.sha' <<<"$PR_JSON")
          HEAD_SHA=$(jq -r '.head.sha' <<<"$PR_JSON")
          TITLE=$(jq -r '.title' <<<"$PR_JSON")
          git fetch canonical "$BASE_SHA" "$HEAD_SHA"
          git checkout -B work "origin/$TARGET"
          git diff --binary "$BASE_SHA" "$HEAD_SHA" > /tmp/upstream.patch

          if [ ! -s /tmp/upstream.patch ]; then
            CLEAN=true
            git commit --allow-empty -m "audit: upstream #${PR} has empty delta"
          else
            set +e
            git apply --3way --index /tmp/upstream.patch
            APPLY_STATUS=$?
            set -e

            UNMERGED=$(git diff --name-only --diff-filter=U || true)
            MARKERS=$(git grep -n -E '^(<<<<<<<|=======|>>>>>>>)' || true)
            if [ -n "$UNMERGED" ] || [ -n "$MARKERS" ] || [ "$APPLY_STATUS" -ne 0 ]; then
              CLEAN=false
              mkdir -p docs/integration-conflicts
              {
                echo "# Compatibility audit for upstream PR #${PR}"
                echo
                echo "**${TITLE}**"
                echo
                echo "Base: \`${BASE_SHA}\`"
                echo
                echo "Head: \`${HEAD_SHA}\`"
                echo
                echo "Apply status: \`${APPLY_STATUS}\`"
                echo
                echo "## Unmerged paths"
                echo '```text'
                printf '%s\n' "$UNMERGED"
                echo '```'
                echo
                echo "This branch is diagnostic only. It must not be merged directly."
              } > "docs/integration-conflicts/pr-${PR}.md"
              git add -A
              git commit -m "diagnostics: upstream #${PR} compatibility conflicts"
            else
              CLEAN=true
              git diff --cached --check
              git commit -m "audit: clean upstream #${PR} delta"
            fi
          fi

          echo "clean=$CLEAN" >> "$GITHUB_OUTPUT"
          if [ "$CLEAN" = true ]; then
            BRANCH="audit/clean-${PR}"
          else
            BRANCH="audit/conflict-${PR}"
          fi
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          git push origin "HEAD:refs/heads/${BRANCH}" --force

      - name: Summary
        run: |
          echo "### Upstream #${{ matrix.pr }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Clean apply: ${{ steps.audit.outputs.clean }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch: \`${{ steps.audit.outputs.branch }}\`" >> "$GITHUB_STEP_SUMMARY"

  note-isolated:
    name: Isolated upstream work
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo '### Intentionally outside the matrix' >> "$GITHUB_STEP_SUMMARY"
          echo '- #580 Code Graph: isolated due to size/history contamination.' >> "$GITHUB_STEP_SUMMARY"
          echo '- #613 Task/DAG: blocked because upstream explicitly marks it WIP and says parts need rollback.' >> "$GITHUB_STEP_SUMMARY"
