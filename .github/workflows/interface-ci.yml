name: Interface CI

on:
  push:
    branches:
      - main
      - "integration/**"
    paths:
      - "interface/**"
      - ".github/workflows/interface-ci.yml"
  pull_request:
    branches:
      - main
      - "integration/**"
    paths:
      - "interface/**"
      - ".github/workflows/interface-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: interface-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Interface quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: interface
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      - name: Install dependencies
        run: bun ci

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Production build
        run: bun run build
